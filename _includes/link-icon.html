{% assign icon_name = include.link.icon %}
{% assign initial = include.link.name | slice: 0, 1 | upcase %}
<span class="link-icon" aria-hidden="true">
  {% if icon_name %}
    <img src="{{ '/assets/icons/' | append: icon_name | relative_url }}" alt="" onerror="this.hidden=true; this.nextElementSibling.hidden=false;">
  {% endif %}
  <span class="icon-fallback"{% if icon_name %} hidden{% endif %}>{{ initial }}</span>
</span>
