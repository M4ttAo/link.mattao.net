{% assign icon_name = include.link.icon | default: "default.svg" %}
<span class="link-icon" aria-hidden="true">
  <img src="{{ '/assets/icons/' | append: icon_name | relative_url }}"
       alt=""
       onerror="this.onerror=null; this.src='{{ '/assets/icons/default.svg' | relative_url }}';">
</span>
