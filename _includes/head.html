<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <script>
    (function () {
      var theme = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#eef1f5" : "#0b1120");
      document.documentElement.setAttribute("data-layout", localStorage.getItem("layout") === "list" ? "list" : "grid");
    }());
  </script>
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/images/logo.png' | relative_url }}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
</head>
